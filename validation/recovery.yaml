# Shared recovery settings. Include only after confirming the real hardware.
# Use a private secrets.yaml. The example contains only public lab dummy values.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:
    ssid: !secret ikettle_recovery_ap_ssid
    password: !secret ikettle_recovery_ap_password
    ap_timeout: 90s

api:
  reboot_timeout: 0s
  encryption:
    key: !secret ikettle_api_encryption_key

ota:
  - platform: esphome
    password: !secret ikettle_ota_password

safe_mode:
  num_attempts: 3
  boot_is_good_after: 60s
  boot_is_good_on_shutdown: false
  reboot_timeout: 10min

# The portal also auto-loads standard HTTP OTA; native OTA's password does not
# authenticate that HTTP upload endpoint. The fallback AP's WPA password protects
# access to that portal, which has no separate HTTP password. No full web_server
# dashboard is configured. Standard portal HTTP OTA remains enabled by ESPHome.
captive_portal:

button:
  - platform: safe_mode
    name: Restart in safe mode
    entity_category: config
